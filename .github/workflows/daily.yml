name: Daily YouTube Trend Report

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 日本時間 毎朝7:00
  workflow_dispatch:        # 手動実行ボタン

permissions:
  contents: write

concurrency:
  group: daily-trend-report
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit report
        run: |
          git config user.name "trend-bot"
          git config user.email "trend-bot@users.noreply.github.com"
          git add reports/ data/
          git commit -m "report: $(TZ=Asia/Tokyo date +%F)" || echo "no changes"
          git pull --rebase
          git push
